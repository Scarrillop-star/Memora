<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEMORA — Iniciar sesión</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>MEMORA</h1>
      <p class="subtitle" id="subtitle">Sistema de asistencia y tareas escolares</p>

      <!-- Paso 1: escribir el usuario -->
      <form id="form-usuario">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" autocomplete="username" required>
        <div class="error-msg" id="error-usuario"></div>
        <button type="submit">Continuar</button>
      </form>

      <!-- Paso 2a: ya tiene contraseña -->
      <form id="form-login" style="display:none;">
        <p class="hint" id="usuario-detectado-login"></p>
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password">
        <div class="error-msg" id="error-login"></div>
        <button type="submit">Ingresar</button>
        <button type="button" class="btn-outline" id="btn-volver-1" style="margin-top:8px;width:100%;padding:10px;border-radius:8px;">Usar otro usuario</button>
      </form>

      <!-- Paso 2b: primera vez, crear contraseña -->
      <form id="form-crear" style="display:none;">
        <p class="hint" id="usuario-detectado-crear"></p>
        <label for="crear-password">Crea tu contraseña</label>
        <input type="password" id="crear-password" autocomplete="new-password">
        <label for="crear-confirmar">Confírmala</label>
        <input type="password" id="crear-confirmar" autocomplete="new-password">
        <div class="error-msg" id="error-crear"></div>
        <button type="submit">Crear contraseña y entrar</button>
        <button type="button" class="btn-outline" id="btn-volver-2" style="margin-top:8px;width:100%;padding:10px;border-radius:8px;">Usar otro usuario</button>
      </form>

      <div class="demo-box" id="demo-box">
        <strong>Usuarios de demostración</strong> (aún sin contraseña, la creas al entrar)<br>
        Estudiante: estudiante1 … estudiante5<br>
        Líder: lider1, lider2<br>
        Profesor: profesor
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
